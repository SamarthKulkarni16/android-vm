name: android-live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Boot emulator, verify, tunnel, commit address, stay alive (all in one step)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            echo "=== confirm emulator is up ==="
            adb devices -l

            echo "=== who is listening on 5555 ==="
            (ss -tlnp | grep 5555 || netstat -tlnp | grep 5555 || echo "nothing on 5555 yet")

            echo "=== opening ngrok tcp tunnel ==="
            nohup ngrok tcp 5555 --log=stdout > /tmp/ngrok.log 2>&1 &
            sleep 6
            ADDR=""
            for i in $(seq 1 10); do
              ADDR=$(curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['tunnels'][0]['public_url'])" 2>/dev/null || true)
              if [ -n "$ADDR" ]; then break; fi
              sleep 3
            done
            if [ -z "$ADDR" ]; then
              echo "ngrok failed to establish a tunnel:"
              cat /tmp/ngrok.log
              exit 1
            fi
            HOSTPORT=$(echo "$ADDR" | sed 's#tcp://##')
            echo "=================================================="
            echo "CONNECT WITH: adb connect $HOSTPORT"
            echo "then run: scrcpy"
            echo "=================================================="

            echo "=== committing connect address to repo ==="
            mkdir -p logs
            echo "adb connect $HOSTPORT" > logs/connect-now.txt
            echo "run_id: ${{ github.run_id }}" >> logs/connect-now.txt
            echo "generated: $(date -u)" >> logs/connect-now.txt
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add logs/connect-now.txt
            git commit -m "connect address for run ${{ github.run_id }}" || echo "nothing to commit"
            git pull --rebase origin main -q || true
            git push || echo "push failed, non-fatal"

            echo "=== confirming emulator + tunnel still alive right after commit ==="
            pgrep -fa qemu || echo "WARNING: qemu process gone already"
            adb devices -l

            echo "=== keeping session alive for up to ~4.5 hours ==="
            for i in $(seq 1 270); do
              sleep 60
              if ! pgrep -fa qemu > /dev/null; then
                echo "qemu died at minute $i — ending early"
                break
              fi
              echo "alive minute $i/270"
            done
