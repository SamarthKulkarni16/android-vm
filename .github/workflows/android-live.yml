name: android-live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Boot emulator, verify, tunnel, commit address, stay alive (all in one step)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb devices -l
            echo "minimal test — boot step alone"

      - name: Minimal test - is emulator alive in a separate following step
        run: |
          mkdir -p logs
          {
            echo "qemu process check:"
            pgrep -fa qemu || echo "NO QEMU"
            echo "adb devices:"
            adb devices -l
          } > logs/minimal-test-latest.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/minimal-test-latest.txt
          git commit -m "minimal test for run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main -q || true
          git push || echo "push failed, non-fatal"
