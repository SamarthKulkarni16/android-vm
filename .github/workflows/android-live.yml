name: android-live

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Boot Android emulator (KVM-accelerated)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb devices
            adb tcpip 5555
            sleep 3
            adb devices

      - name: Verify local adb-over-tcp before exposing it
        run: |
          echo "=== pre-check: adb devices ===" | tee /tmp/local-verify.txt
          adb devices | tee -a /tmp/local-verify.txt
          echo "=== who is listening on 5555 ===" | tee -a /tmp/local-verify.txt
          (ss -tlnp | grep 5555 || netstat -tlnp | grep 5555 || echo "nothing found listening on 5555") | tee -a /tmp/local-verify.txt
          echo "=== forcing a local reconnect on localhost:5555 ===" | tee -a /tmp/local-verify.txt
          adb disconnect 2>&1 | tee -a /tmp/local-verify.txt
          sleep 2
          OK=0
          for i in $(seq 1 8); do
            adb connect localhost:5555 2>&1 | tee -a /tmp/local-verify.txt
            sleep 2
            if adb devices | grep -q "localhost:5555[[:space:]]*device"; then
              OK=1
              echo "LOCAL CONNECT SUCCEEDED on attempt $i" | tee -a /tmp/local-verify.txt
              break
            fi
            echo "attempt $i not yet 'device' status, retrying..." | tee -a /tmp/local-verify.txt
            sleep 2
          done
          echo "=== final adb devices ===" | tee -a /tmp/local-verify.txt
          adb devices | tee -a /tmp/local-verify.txt
          if [ "$OK" != "1" ]; then
            echo "LOCAL ADB-OVER-TCP NEVER CAME UP — the emulator's adbd itself is the problem, not the tunnel. Stopping before wasting an ngrok tunnel on it." | tee -a /tmp/local-verify.txt
            exit 1
          fi

      - name: Open ngrok TCP tunnel and print connect address
        run: |
          nohup ngrok tcp 5555 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 6
          for i in $(seq 1 10); do
            ADDR=$(curl -s http://localhost:4040/api/tunnels | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['tunnels'][0]['public_url'])" 2>/dev/null)
            if [ -n "$ADDR" ]; then break; fi
            sleep 3
          done
          if [ -z "$ADDR" ]; then
            echo "ngrok failed to establish a tunnel — check NGROK_AUTHTOKEN secret and /tmp/ngrok.log below"
            cat /tmp/ngrok.log
            exit 1
          fi
          HOSTPORT=$(echo "$ADDR" | sed 's#tcp://##')
          echo "=================================================="
          echo "CONNECT WITH: adb connect $HOSTPORT"
          echo "then run: scrcpy"
          echo "=================================================="
          echo "session will stay alive for up to 5 hours"
          echo "$HOSTPORT" > /tmp/connect-address.txt

      - name: Commit connect address immediately (don't wait for the 5hr keep-alive)
        run: |
          mkdir -p logs
          echo "adb connect $(cat /tmp/connect-address.txt)" > logs/connect-now.txt
          echo "run_id: ${{ github.run_id }}" >> logs/connect-now.txt
          echo "generated: $(date -u)" >> logs/connect-now.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/connect-now.txt
          git commit -m "connect address for run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main -q || true
          git push || echo "push failed, non-fatal"

      - name: Commit local-verify log (always)
        if: always()
        run: |
          mkdir -p logs
          cp /tmp/local-verify.txt logs/local-verify-latest.txt 2>/dev/null || echo "no local-verify.txt found" > logs/local-verify-latest.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/local-verify-latest.txt
          git commit -m "local-verify log from run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main -q || true
          git push || echo "push failed, non-fatal"

      - name: Keep session alive
        run: |
          for i in $(seq 1 295); do
            sleep 60
            echo "alive minute $i/295 — job auto-ends at 300min GitHub hard cap"
          done

      - name: Commit debug log (always, for visibility outside the Actions log viewer)
        if: always()
        run: |
          mkdir -p logs
          {
            echo "=== ngrok log ==="
            cat /tmp/ngrok.log 2>&1 || echo "(no ngrok.log found)"
            echo ""
            echo "=== ngrok tunnels API response ==="
            curl -s http://localhost:4040/api/tunnels 2>&1 || echo "(4040 not reachable)"
            echo ""
            echo "=== ngrok binary check ==="
            which ngrok 2>&1
            ngrok version 2>&1
          } > logs/last-run.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/last-run.txt
          git commit -m "debug log from run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase origin main -q || true
          git push || echo "push failed, non-fatal"
